<ion-content [fullscreen]="true" class="welcome-content">
  <div class="welcome-container">

    <div class="top-bar">
      <div class="brand">
        <strong>EcoApp</strong>
        <span>Sampah Menjadi Rupiah</span>
      </div>
      <span class="badge-pill">Jadi Berkah</span>
    </div>

    <div class="logo-wrap">
      <img src="assets/icon/logo.jpeg" alt="Logo EcoApp" />
    </div>

    <div class="bottom-section">
      <span class="tag">♻ LANGKAH KECIL, DAMPAK BESAR</span>

      <h1>Ubah Sampah Jadi <span class="highlight">Dampak Positif</span></h1>

      <p class="desc">
        Selesaikan permintaan tanpa ribet: setor sampah dari rumah,
        dan pantau perkembangannya bersama komunitas.
      </p>

      <ion-button expand="block" class="btn-start" routerLink="/register">
        Mulai Sekarang
        <ion-icon slot="end" name="arrow-forward"></ion-icon>
      </ion-button>

      <p class="login-text">
        Sudah punya akun? <a routerLink="/login">Masuk</a>
      </p>
    </div>

  </div>
</ion-content>
